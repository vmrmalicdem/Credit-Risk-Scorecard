# Project configuration. Every tunable value used by the pipeline lives here; code holds no parameters.
seed: 42
vintage_year: 2015
prediction_rule:
  type: loan_age            # see docs/target_definition.md
  age_months: 24
outcome_window_months: 12
max_first_payment: 201603   # drops converted/modified-type outliers
default_event:
  delinq_status_min: 3      # 90+ days
  reo_status: "RA"
  credit_zero_balance_codes: ["02", "03", "09", "15"]
  excluded_termination_codes: ["16", "96"]
  censored_codes: ["01"]
split:
  test_size: 0.30           # ~221 events in total, so a fixed validation set would be too small
  cv_folds: 5               # stratified, loan-level, inside the development set only
paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  artifacts: artifacts
  reports: reports

# Feature sets. Behaviour features are observed at or before the prediction month; the value lists the source
# fields, which tests check against the schema tags (known_at) so no outcome field can enter.
features:
  origination:
    numeric: [credit_score, ltv, cltv, dti, orig_upb, orig_rate, mi_pct, num_units, orig_term, num_borrowers]
    categorical: [first_time_homebuyer, occupancy, channel, loan_purpose, property_type, state,
                  prepay_penalty_flag, super_conforming, harp_flag]
  behaviour:
    numeric:
      upb_ratio: [current_upb]
      delinq_at_pred: [delinq_status]
      max_delinq_prior12: [delinq_status]
      ever_90_before: [delinq_status]
    categorical:
      mod_at_pred: [mod_flag]
  behaviour_lookback_months: 12
  expected_signs: {credit_score: -1, ltv: 1, cltv: 1, dti: 1, orig_rate: 1,
                   delinq_at_pred: 1, max_delinq_prior12: 1, ever_90_before: 1}

scorecard:
  n_bins: 5
  min_category_frequency: 0.01
  c_grid: [0.01, 0.03, 0.1, 0.3, 1.0]

lgbm:
  fixed: {n_estimators: 300, subsample: 0.8, subsample_freq: 1, colsample_bytree: 0.8}
  grid:
    learning_rate: [0.02, 0.05]
    num_leaves: [4, 8, 16]
    min_child_samples: [50, 150]
    reg_lambda: [1, 10]

evaluation:
  n_bootstrap: 500
  top_share: 0.10           # "recall in the top 10% of scores"
  calibration_bins: 5
  prob_clip: 1.0e-6
  platt_c: 1.0e+6           # effectively unregularized logistic recalibration

lgd:
  min_segment_loans: 30
  ltv_split: 80.0
  bootstrap_resamples: 2000
  floor: 0.0
  cap: 1.0

stress:
  ltv_cap: 150.0
  reference_quantile: 0.99  # extrapolation is reported against this quantile of observed values
  scenarios:
    baseline: {ltv_pp: 0, rate_pts: 0.0}
    ltv_10: {ltv_pp: 10, rate_pts: 0.0}
    ltv_20: {ltv_pp: 20, rate_pts: 0.0}
    rate_200: {ltv_pp: 0, rate_pts: 2.0}
    combined: {ltv_pp: 20, rate_pts: 2.0}

points:                     # score = base_score + factor * ln(good:bad odds), higher = lower risk
  base_score: 600
  base_odds: 200
  pdo: 20
  min_bin_loans: 50
  top_features: 12

# Data validation (Pandera). Applied to the cleaned origination table, the modeling table and scoring input.
# max_null_rate defaults to 0 (no missing values allowed). Bounds are guardrails, not model assumptions:
# widen them in this file if the data legitimately exceeds them. Freddie Mac files carry no income field, so
# DTI and original balance are the affordability and size bounds.
validation:
  on_failure: raise            # raise | warn
  tables:
    origination: {min_rows: 1000, unique: [loan_id]}
    model_table: {min_rows: 1000, min_defaults: 50, default_rate: [0.0005, 0.20], unique: [loan_id]}
  columns:
    credit_score: {min: 300, max: 850, max_null_rate: 0.02}
    ltv: {min: 1, max: 998, max_null_rate: 0.01}
    cltv: {min: 1, max: 998, max_null_rate: 0.01}
    dti: {min: 0, max: 100, max_null_rate: 0.15}
    orig_upb: {min: 1000, max: 2000000}
    orig_rate: {min: 0.5, max: 15}
    mi_pct: {min: 0, max: 60, max_null_rate: 0.01}
    num_units: {min: 1, max: 4, max_null_rate: 0.01}
    orig_term: {min: 12, max: 480}
    num_borrowers: {min: 1, max: 10, max_null_rate: 0.01}
    first_time_homebuyer: {allowed: [Y, N], max_null_rate: 0.05}
    occupancy: {allowed: [P, I, S], max_null_rate: 0.01}
    channel: {allowed: [R, B, C, T], max_null_rate: 0.01}
    loan_purpose: {allowed: [P, C, N], max_null_rate: 0.01}
    property_type: {allowed: [SF, PU, CO, MH, CP], max_null_rate: 0.01}
    state: {pattern: '^[A-Z]{2}$'}
    prepay_penalty_flag: {allowed: [Y, N], max_null_rate: 0.01}
    super_conforming: {allowed: [Y, N], max_null_rate: 1.0}
    harp_flag: {allowed: [Y, N], max_null_rate: 1.0}
    upb_ratio: {min: 0, max: 1.5}
    delinq_at_pred: {min: 0, max: 2}
    max_delinq_prior12: {min: 0, max: 99, max_null_rate: 0.0}
    ever_90_before: {allowed: [0, 1]}
    mod_at_pred: {allowed: [Y, N]}
    ead: {min: 1, max: 5000000}
    target: {allowed: [0, 1]}
    meta_disaster_event: {allowed: [0, 1]}
    meta_assist_event: {allowed: [0, 1]}
    pred_period: {pattern: '^\d{6}$'}
    loan_id: {pattern: '^[A-Z]\w{2,}$'}

# Experiment tracking and model registry (MLflow, local SQLite store; see docs/experiment_tracking.md).
# Registry labels are aliases (MLflow's replacement for the deprecated Staging/Production stages).
mlflow:
  enabled: true
  tracking_uri: sqlite:///mlruns/mlflow.db
  artifact_root: mlruns/artifacts
  experiment: credit-risk-scorecard
  model_name: "creditrisk-{feature_set}-{model}"
  candidate_alias: candidate
  production_alias: production
  previous_alias: previous_production
  code_root: .
  code_paths: [src, configs, pyproject.toml, requirements.txt]   # dirty = uncommitted changes in these paths
  promotion:                     # gates checked by `registry promote`; --force --reason overrides and is recorded
    min_test_roc_auc: 0.70
    max_roc_auc_drop_vs_production: 0.02
    require_clean_code: true
    require_matching_data: true
