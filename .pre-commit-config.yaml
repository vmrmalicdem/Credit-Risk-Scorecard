repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: ["--fix"]
  - repo: local
    hooks:
      - id: block-loan-data
        name: block raw or derived loan data from being committed
        language: fail
        entry: "Loan-level data and model artifacts must not be committed (see README, data terms)."
        files: ^(data|artifacts|mlruns)/
